<title>Claude Admin Center — UI prototype (ticket #5)</title>
<!--
  PROTOTYPE — THROWAWAY. Do not promote to production.
  Answers wayfinder ticket #5: "What should the dashboard look and feel like?"
  Plan: three structurally different variants of the Claude Admin Center shell,
  switchable via ?variant=A|B|C and the floating bottom bar (or ← / → keys).
    A — Console:      left sidebar, dense tables, advisor in a right drawer, Activity as its own section.
    B — Overview:     summary-card home with drill-ins, persistent Activity rail, advisor expands inline.
    C — Command deck: always-dark top-tab terminal, Activity ticker, advisor as a queued tray.
    D — HUD:          Stark-style holographic landing page — ring gauge, glowing modules, advisor orb.
  All data is mock. No persistence, no real readers.
-->
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
    --accent-soft: rgba(42, 120, 214, 0.10);
    --advisor: #4a3aa7;
    --advisor-soft: rgba(74, 58, 167, 0.08);
    --good: #0ca30c;
    --good-text: #006300;
    --warn: #fab219;
    --serious: #ec835a;
    --crit: #d03b3b;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
      --accent-soft: rgba(57, 135, 229, 0.14);
      --advisor: #9085e9;
      --advisor-soft: rgba(144, 133, 233, 0.12);
      --good-text: #0ca30c;
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.14);
    --advisor: #9085e9;
    --advisor-soft: rgba(144, 133, 233, 0.12);
    --good-text: #0ca30c;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  a { color: var(--accent); text-decoration: none; }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---------- shared bits ---------- */
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em;
    padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--ink2); white-space: nowrap; vertical-align: middle;
  }
  .badge.live { color: var(--good-text); border-color: currentColor; }
  .badge.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
  .badge.orphan { color: var(--serious); border-color: currentColor; }
  .badge.gc { color: var(--muted); border-style: dashed; }
  .badge.longctx { color: var(--accent); border-color: currentColor; }
  .dot-on, .dot-off { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .dot-on { background: var(--good); }
  .dot-off { background: transparent; border: 1.5px solid var(--muted); }

  .ask-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 7px; color: var(--advisor);
    border: 1px solid transparent;
  }
  .ask-btn:hover { background: var(--advisor-soft); border-color: var(--advisor); }
  .ask-btn.busy svg { animation: spin 1.2s linear infinite; }
  .ask-btn-wide {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 13px;
    color: var(--advisor); border: 1px solid var(--advisor); background: var(--advisor-soft);
  }
  .checked-at { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--advisor-soft); border-top-color: var(--advisor);
    animation: spin 0.9s linear infinite;
  }
  .skeleton { height: 10px; border-radius: 5px; background: var(--grid); margin: 10px 0; animation: pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

  .rec { border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; background: var(--surface); }
  .rec + .rec { margin-top: 8px; }
  .rec h4 { margin: 0 0 3px; font-size: 13px; font-weight: 600; }
  .rec p { margin: 0; font-size: 12.5px; color: var(--ink2); }
  .sev { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 5px; }
  .sev .ic { font-family: var(--mono); font-weight: 700; }
  .sev.serious { color: var(--serious); }
  .sev.warn { color: color-mix(in srgb, var(--warn) 70%, var(--ink)); }
  .sev.good { color: var(--good-text); }
  .adv-history { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 10px; font-size: 12px; }
  .adv-history .row { display: flex; justify-content: space-between; padding: 3px 0; color: var(--ink2); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .tile .val { font-size: 25px; font-weight: 650; margin-top: 2px; }
  .tile .sub { font-size: 11.5px; color: var(--ink2); margin-top: 1px; }
  .tile .up { color: var(--good-text); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .card-head h3 { font-size: 13.5px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--ink2); }
  .legend .chip { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 11px; height: 11px; border-radius: 3px; }
  .chart-scroll { overflow-x: auto; }
  .ghost-btn { font-size: 12px; color: var(--ink2); border: 1px solid var(--border); border-radius: 7px; padding: 3px 10px; }
  .ghost-btn:hover, .ghost-btn.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .pills { display: flex; gap: 6px; }
  .pill { font-size: 12px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink2); }
  .pill.on { background: var(--ink); color: var(--page); border-color: var(--ink); font-weight: 600; }

  .hbar-row { display: grid; grid-template-columns: 88px 1fr 76px; align-items: center; gap: 10px; padding: 5px 0; font-size: 12.5px; }
  .hbar-track { height: 14px; }
  .hbar { height: 14px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }

  .stub { padding: 60px 20px; text-align: center; color: var(--muted); }
  .stub b { color: var(--ink2); }

  #tooltip {
    position: fixed; z-index: 90; pointer-events: none; display: none;
    background: var(--ink); color: var(--page); font-size: 11.5px; line-height: 1.35;
    padding: 5px 9px; border-radius: 6px; max-width: 260px;
  }

  /* ---------- proto switcher bar (not part of the design) ---------- */
  #proto-bar {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 100;
    display: flex; align-items: center; gap: 4px;
    background: var(--ink); color: var(--page);
    border-radius: 999px; padding: 5px 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    font-size: 12.5px;
  }
  #proto-bar button { color: inherit; padding: 2px 9px; border-radius: 999px; font-weight: 700; }
  #proto-bar button:hover { background: rgba(128,128,128,0.35); }
  #proto-bar .plabel { padding: 0 6px; min-width: 240px; text-align: center; }
  #proto-bar .pkeys { opacity: 0.55; font-size: 10.5px; padding-right: 4px; }
  body:has(.vc) #proto-bar { bottom: 46px; }

  /* =========================================================
     VARIANT A — Console: sidebar + dense tables + right drawer
     ========================================================= */
  .va { display: grid; grid-template-columns: 218px 1fr; min-height: 100vh; }
  .va-side { background: var(--surface); border-right: 1px solid var(--border); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; }
  .va-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; padding: 2px 10px 14px; }
  .va-brand .glyph { color: var(--advisor); }
  .va-nav { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 7px; font-size: 13px; color: var(--ink2); width: 100%; text-align: left; }
  .va-nav svg { flex: none; opacity: 0.75; }
  .va-nav:hover { background: var(--accent-soft); }
  .va-nav.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .va-side .foot { margin-top: auto; font-size: 10.5px; color: var(--muted); padding: 10px; border-top: 1px solid var(--border); }
  .va-main { padding: 22px 28px 80px; max-width: 1060px; }
  .va-pagehead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  .va-pagehead h1 { font-size: 19px; }
  .va table th { text-align: left; font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .va table td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  .va tr[data-act] { cursor: pointer; }
  .va tbody tr:hover { background: var(--accent-soft); }
  .va .obj-name { font-weight: 600; }
  .va .obj-path { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 1px; }
  .va-back { font-size: 12.5px; display: inline-block; margin-bottom: 10px; }
  .va-detailhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .va-section { margin-top: 22px; }
  .va-section > h2 { font-size: 13.5px; margin-bottom: 8px; }
  .enab-row { display: flex; align-items: center; padding: 7px 2px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .enab-row .scope { margin-left: auto; font-size: 11px; color: var(--muted); }
  .va-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 390px; z-index: 60;
    background: var(--surface); border-left: 1px solid var(--border);
    box-shadow: -12px 0 30px rgba(0,0,0,0.12); padding: 18px 20px; overflow-y: auto;
  }
  .va-drawer .dhead { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
  .va-drawer .dhead .x { margin-left: auto; font-size: 17px; color: var(--muted); padding: 2px 8px; }
  .va-drawer .dhead .x:hover { color: var(--ink); }

  /* =========================================================
     VARIANT B — Overview-first: cards + drill-ins + activity rail
     ========================================================= */
  .vb-top { display: flex; align-items: center; gap: 18px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40; }
  .vb-top .brand { font-weight: 700; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .vb-top .brand .glyph { color: var(--advisor); }
  .vb-search { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; color: var(--muted); font-size: 13px; background: var(--page); }
  .vb-top .root { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .vb-body { display: grid; grid-template-columns: 1fr 300px; gap: 0; align-items: start; }
  .vb-content { padding: 22px 26px 90px; max-width: 980px; }
  .vb-rail { border-left: 1px solid var(--border); background: var(--surface); min-height: calc(100vh - 49px); padding: 16px 16px 80px; position: sticky; top: 49px; }
  .vb-rail h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
  .vb-rail h3 .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: pulse 1.4s ease-in-out infinite alternate; }
  .act-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .act-item .meta { display: flex; gap: 8px; font-size: 10.5px; color: var(--muted); margin-bottom: 2px; font-family: var(--mono); }
  .act-item .meta .proj { color: var(--accent); }
  .act-item .q { color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumbs { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .vb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .vb-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: left; display: block; width: 100%; }
  .vb-card:hover { border-color: var(--accent); }
  .vb-card .t { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .vb-card .big { font-size: 27px; font-weight: 650; margin: 6px 0 2px; }
  .vb-card .sub { font-size: 12px; color: var(--ink2); }
  .vb-card.wide { grid-column: span 3; display: flex; align-items: center; gap: 26px; }
  .vb-proj { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .vb-proj .row1 { display: flex; align-items: center; gap: 10px; }
  .vb-proj .stats { display: flex; gap: 22px; margin-left: auto; font-size: 12.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .vb-proj .stats b { color: var(--ink); font-weight: 600; }
  .vb-inline-adv { border-top: 1px dashed var(--border); margin-top: 12px; padding-top: 12px; }
  .vb-name { font-weight: 600; font-size: 14.5px; color: var(--ink); }
  .vb-name:hover { color: var(--accent); }

  /* =========================================================
     VARIANT C — Command deck: always dark, top tabs, ticker, tray
     ========================================================= */
  .vc {
    color-scheme: dark;
    --page: #0c0d10;
    --surface: #14161b;
    --ink: #f2f3f5;
    --ink2: #c3c2b7;
    --muted: #82868f;
    --grid: #24262c;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.09);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.14);
    --advisor: #9085e9;
    --advisor-soft: rgba(144, 133, 233, 0.13);
    --good-text: #0ca30c;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    background: var(--page); color: var(--ink);
    min-height: 100vh; padding-bottom: 120px;
  }
  .vc-top { display: flex; align-items: center; gap: 22px; padding: 0 20px; height: 46px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40; }
  .vc-brand { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.14em; }
  .vc-brand .glyph { color: var(--advisor); }
  .vc-tabs { display: flex; gap: 2px; height: 100%; }
  .vc-tab { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); padding: 0 11px; border-bottom: 2px solid transparent; }
  .vc-tab:hover { color: var(--ink); }
  .vc-tab.on { color: var(--ink); border-bottom-color: var(--advisor); }
  .vc-top .right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .vc-top .live { color: var(--good); }
  .vc-main { padding: 18px 22px; max-width: 1160px; }
  .vc-strip { display: flex; gap: 26px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding: 0 2px 12px; flex-wrap: wrap; }
  .vc-strip b { color: var(--ink); font-weight: 600; }
  .vc table { font-family: var(--mono); font-size: 12px; }
  .vc table th { text-align: left; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 5px 10px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .vc table td { padding: 5px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  .vc tr[data-act] { cursor: pointer; }
  .vc tbody tr:hover { background: rgba(255,255,255,0.035); }
  .vc .pname { color: var(--ink); font-weight: 600; }
  .vc .ppath { color: var(--muted); font-size: 11px; }
  .vc-h1 { font-family: var(--mono); font-size: 15px; letter-spacing: 0.04em; margin-bottom: 4px; }
  .vc-ticker { position: fixed; left: 0; right: 0; bottom: 0; height: 34px; background: var(--surface); border-top: 1px solid var(--border); overflow: hidden; display: flex; align-items: center; z-index: 50; }
  .vc-ticker .tlabel { flex: none; padding: 0 12px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; color: var(--advisor); border-right: 1px solid var(--border); text-transform: uppercase; }
  .vc-ticker .scroll { white-space: nowrap; font-family: var(--mono); font-size: 11px; color: var(--ink2); animation: tick 40s linear infinite; padding-left: 100%; }
  .vc-ticker .scroll .tp { color: var(--accent); }
  @keyframes tick { to { transform: translateX(-100%); } }
  @media (prefers-reduced-motion: reduce) { .vc-ticker .scroll { padding-left: 12px; } }
  .vc-tray { position: fixed; right: 16px; bottom: 46px; width: 330px; z-index: 55; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 32px rgba(0,0,0,0.5); overflow: hidden; }
  .vc-tray .thead { display: flex; align-items: center; gap: 8px; padding: 9px 13px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--advisor); border-bottom: 1px solid var(--border); width: 100%; text-align: left; }
  .vc-tray .thead .n { margin-left: auto; color: var(--muted); }
  .vc-tray .titem { padding: 9px 13px; border-bottom: 1px solid var(--grid); font-size: 12.5px; }
  .vc-tray .titem .r1 { display: flex; align-items: center; gap: 9px; }
  .vc-tray .st { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; margin-left: auto; }
  .vc-tray .st.q { color: var(--warn); }
  .vc-tray .st.r { color: var(--accent); }
  .vc-tray .st.d { color: var(--good); }
  .vc-tray .body { max-height: 330px; overflow-y: auto; }

  /* =========================================================
     VARIANT D — HUD: single-theme holographic landing page
     ========================================================= */
  .vd {
    color-scheme: dark;
    --page: #04070c;
    --surface: rgba(8, 18, 26, 0.85);
    --ink: #d8f2fc;
    --ink2: #9fc3d2;
    --muted: #54788c;
    --grid: rgba(56, 214, 245, 0.12);
    --baseline: rgba(56, 214, 245, 0.3);
    --border: rgba(56, 214, 245, 0.22);
    --accent: #38d6f5;
    --accent-soft: rgba(56, 214, 245, 0.12);
    --advisor: #38d6f5;
    --advisor-soft: rgba(56, 214, 245, 0.12);
    --good-text: #2fe08a;
    --cyan: #38d6f5;
    --cyan-line: rgba(56, 214, 245, 0.28);
    min-height: 100vh; padding-bottom: 150px;
    color: var(--ink); font-family: var(--mono);
    background:
      radial-gradient(1200px 620px at 50% -10%, rgba(56, 214, 245, 0.10), transparent 60%),
      radial-gradient(900px 520px at 50% 112%, rgba(56, 214, 245, 0.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(56, 214, 245, 0.025) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(90deg, rgba(56, 214, 245, 0.025) 0 1px, transparent 1px 44px),
      #04070c;
  }
  .vd::after {

/* ============================= chart builders (shared) ============================= */
function roundedTopRect(x, y, w, h, r) {
  if (h <= r) return `M${x},${y} h${w} v${h} h${-w} Z`;
  return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
}
function stackedChart() {
  const W = 660, H = 210, padL = 34, padR = 6, padT = 8, padB = 20;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const max = 30; // nice ceiling over the 28.1 peak
  const slot = innerW / USAGE_DAYS.length, barW = Math.round(slot * 0.62);
  let out = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spend by model, last 14 days">`;
  for (const gv of [0, 10, 20, 30]) {
    const gy = padT + innerH - (gv / max) * innerH;
    out += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="${gv === 0 ? 'var(--baseline)' : 'var(--grid)'}" stroke-width="1"/>`;
    if (gv > 0) out += `<text x="${padL - 5}" y="${gy + 3}" text-anchor="end" font-size="10" fill="var(--muted)">$${gv}</text>`;
  }
  USAGE_DAYS.forEach((day, di) => {
    const x = Math.round(padL + di * slot + (slot - barW) / 2);
    let yCursor = padT + innerH;
    const segs = day.v.map((v, mi) => ({ v, mi })).filter(s => s.v > 0);
    segs.forEach((s, k) => {
      const h = Math.max((s.v / max) * innerH, 1.5);
      const y = yCursor - h;
      const tip = `${day.d} · ${MODELS[s.mi].name} · $${s.v.toFixed(2)}`;
      const isTop = k === segs.length - 1;
      if (isTop) out += `<path d="${roundedTopRect(x, y, barW, h, 3)}" fill="var(--${MODELS[s.mi].varClass})" data-tip="${tip}"/>`;
      else out += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="var(--${MODELS[s.mi].varClass})" data-tip="${tip}"/>`;
      yCursor = y - 2; // 2px surface gap between stacked segments
    });
    if (di % 2 === 0) out += `<text x="${x + barW / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${day.d}</text>`;
  });
  return out + '</svg>';
}

function sparkline(points, w = 84, h = 22, cls = 'var(--accent)') {
  const max = Math.max(...points, 1);

}

    <text x="125" y="118" text-anchor="middle" font-size="30" font-weight="650" fill="var(--ink)">$${SPEND_14D.toFixed(2)}</text>

    <text x="125" y="160" text-anchor="middle" font-size="10" fill="var(--good-text)">▲ 12% · 63% OF BUDGET</text>
  </svg>`;
}
function renderD() {
  const st = state.adv[advKey('full-sweep')];
  let body;
  if (state.page !== 'home') {
    body = `<div class="vd-stub"><div class="vd-mod">
      <h3 class="vd-h">MODULE // ${state.page.toUpperCase()} <span class="dim">— OFFLINE IN PROTOTYPE</span></h3>
      <p style="font-size:12px;color:var(--ink2);line-height:1.7">Drill-in pages aren’t built for this variant — the HUD treatment is the landing page. A section page would reuse variant C’s density wearing this skin.</p>
      <button class="vd-dockbtn" data-act="nav" data-id="home" style="margin-top:12px">‹ Return to overview</button>
    </div></div>`;
  } else {
    const top5 = [...PROJECTS].sort((a, b) => b.cost - a.cost).slice(0, 5);
    const maxC = top5[0].cost;
    body = `<div class="vd-grid">
      <section>
        <div class="vd-mod"><h3 class="vd-h">Top projects <span class="dim">// 30d spend</span></h3>
          ${top5.map(p => `<div class="vd-row"><span class="pn">${p.id}</span>
            <div><div class="vd-bar" style="width:${(p.cost / maxC * 100).toFixed(0)}%" data-tip="${p.path} · $${p.cost.toFixed(2)} · ${p.sessions} sessions"></div></div>
            <span class="pv">$${p.cost.toFixed(2)}</span></div>`).join('')}
        </div>
        <div class="vd-mod"><h3 class="vd-h">Systems <span class="dim">// MCP + plugins</span></h3>
          ${VD_SYSTEMS.map(x => `<div class="vd-sys"><span class="lamp ${x.on ? 'on' : 'off'}"></span><span>${x.n}</span><span class="k">${x.k}</span><span class="s">${x.s}</span></div>`).join('')}
        </div>
      </section>
      <section class="vd-center">
        ${vdGauge()}
        <div class="vd-readouts">
          <div><div class="v">182M</div><div class="l">TOKENS</div></div>
          <div><div class="v">96</div><div class="l">SESSIONS</div></div>
          <div><div class="v">61%</div><div class="l">CACHE</div></div>
          <div><div class="v">48</div><div class="l">PROJECTS</div></div>
        </div>
        <button class="vd-orb ${st === 'running' ? 'busy' : ''}" data-act="ask-drawer" data-id="full-sweep" aria-label="Ask Claude — full system sweep">${IC.spark}</button>
        <div class="vd-orb-label">Ask Claude // full sweep${st === 'done' ? ' · ✓ just now' : ''}</div>
      </section>
      <section>
        <div class="vd-mod"><h3 class="vd-h">Model loadout <span class="dim">// 14d</span></h3>
          ${MODEL_TOTALS.map(m => `<div class="vd-row"><span class="pn">${m.name}${m.longCtx ? ' [1M]' : ''}</span>
            <div><div class="vd-bar" style="width:${(m.total / MODEL_TOTALS[0].total * 100).toFixed(0)}%" data-tip="${m.id} · $${m.total.toFixed(2)} over 14 days"></div></div>
            <span class="pv">$${m.total.toFixed(2)}</span></div>`).join('')}
        </div>
        <div class="vd-mod"><h3 class="vd-h">Live feed <span class="dim">// history.jsonl</span> <span class="vd-caret">▌</span></h3>
          ${ACTIVITY.slice(0, 6).map(a => `<div class="act-item"><div class="meta"><span>${a.t}</span><span class="proj">${a.p}</span></div><div class="q">${a.q}</div></div>`).join('')}
        </div>
      </section>
    </div>`;
  }
  const advPanel = state.advTarget === 'full-sweep' ? `<aside class="vd-adv">
    <div class="dhead"><span style="color:var(--cyan)">${IC.spark}</span><b>ADVISOR // FULL SWEEP</b>
      <button class="x" data-act="close-drawer" aria-label="Close advisor">×</button></div>
    ${advBody('full-sweep')}
  </aside>` : '';
  return `<div class="vd">
    <header class="vd-topbar">
      <span>CLAUDE ADMIN CENTER <span class="dim">// OPERATIONS OVERVIEW</span></span>
      <span>D:\\claude-config &nbsp;·&nbsp; <span class="ok">ALL SYSTEMS NOMINAL</span></span>
    </header>
    ${body}
    ${advPanel}
    <nav class="vd-dock">${SECTIONS.map(s => `<button class="vd-dockbtn ${state.page === s ? 'on' : ''}" data-act="nav" data-id="${s}">${s}</button>`).join('')}</nav>
  </div>`;
}

/* ============================= shell ============================= */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = state.variant === 'A' ? renderA() : state.variant === 'B' ? renderB() : state.variant === 'C' ? renderC() : renderD();
  document.getElementById('proto-label').textContent = VARIANTS[state.variant];
}
function setVariant(v) {
  state.variant = v;
  state.page = (v === 'B' || v === 'D') ? 'home' : 'Projects';
  state.detailOf = null; state.advTarget = null; state.bOpen = null;
  try { history.replaceState(null, '', '?variant=' + v); } catch (e) { /* sandboxed — in-memory only */ }
  render();
}
function cycle(dir) {
  const keys = Object.keys(VARIANTS);
  setVariant(keys[(keys.indexOf(state.variant) + dir + keys.length) % keys.length]);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A') e.preventDefault();
  if (act === 'prev') return cycle(-1);
  if (act === 'next') return cycle(1);
  if (act === 'nav') { state.page = id === 'home' ? 'home' : id; state.detailOf = null; return render(); }
  if (act === 'open-detail') { state.page = 'detail'; state.detailOf = id; return render(); }
  if (act === 'toggle-table') { state.usageTable = !state.usageTable; return render(); }
  if (act === 'close-drawer') { state.advTarget = null; return render(); }
  if (act === 'ask' ) { startAdvisor(id); return render(); }
  if (act === 'ask-drawer') { e.stopPropagation(); state.advTarget = id; startAdvisor(id); return render(); }
  if (act === 'ask-inline') {
    if (state.bOpen === id) { state.bOpen = null; }
    else { state.bOpen = id; if (state.adv[advKey(id)] !== 'done') startAdvisor(id); }
    return render();
  }
  if (act === 'ask-queue') {
    e.stopPropagation();
    if (!state.queue.find(x => x.id === id)) state.queue.push({ id, st: 'queued', open: false });
    state.trayOpen = true;
    const item = state.queue.find(x => x.id === id);
    if (item.st === 'queued') { item.st = 'running'; startAdvisor(id); }
    return render();
  }
  if (act === 'tray-toggle') { state.trayOpen = !state.trayOpen; return render(); }
  if (act === 'tray-open') { const q = state.queue.find(x => x.id === id); q.open = !q.open; return render(); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});

// shared tooltip for [data-tip]
const tip = document.getElementById('tooltip');
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) { tip.style.display = 'none'; return; }
  tip.textContent = el.dataset.tip;
  tip.style.display = 'block';
});
document.addEventListener('mousemove', e => {
  if (tip.style.display !== 'block') return;
  const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  const y = Math.max(e.clientY - tip.offsetHeight - 10, 6);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});

render();
</script>
